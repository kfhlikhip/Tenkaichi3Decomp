name: Build Tenkaichi Port for Xbox (No MSBuild/Ninja)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-port:
    runs-on: ubuntu-latest # أو Windows إذا كنت تستهدف بيئة Win32/UWP
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (No Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-pip p7zip-full
          # تثبيت المكتبات المطلوبة عبر بايثون إن وجدت
          pip install --upgrade pip

      - name: Configure Build using Make / Custom Script
        run: |
          # استبدال نينجا بـ Unix Makefiles أو بناء مباشر عبر Make
          cmake -B build -G "Unix Makefiles" -DOPTION_XBOX=ON
          # أو تشغيل سكربت الإعداد الخاص بالمشروع إن توفر
          # python3 configure.py --generator make

      - name: Compile using Make (Instead of Ninja/MSBuild)
        run: |
          make -C build -j$(nproc)

      - name: Package Artifacts
        run: |
          mkdir -p output
          cp build/YourCompiledBinary output/ # استبدل بالاسم الفعلي للمخرج

      - name: Upload Xbox Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi-Xbox-Build
          path: output/
