name: Build Tenkaichi Decomp Xbox UWP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore port/win/Tenkaichi3Decomp.sln
      # ملاحظة: إذا كان اسم أو مسار ملف الحل (.sln) مختلفاً في مشروعك، عدله هنا.

    - name: Create Temporary Signing Certificate
      shell: powershell
      run: |
        # إنشاء شهادة رقمية مؤقتة ومجانية وموثوقة محلياً لتوقيع حزمة UWP (Appx)
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=TenkaichiDecomp" -KeyUsage DigitalSignature -FriendlyName "TenkaichiDecomp Cert" -CertStoreLocation "Cert:\CurrentUser\My"
        $password = ConvertTo-SecureString "XboxUwp123" -AsPlainText -Force
        Export-PfxCertificate -Cert $cert -FilePath "${{ github.workspace }}\TemporaryKey.pfx" -Password $password
        echo "CERT_PASSWORD=XboxUwp123" >> $env:GITHUB_ENV

    - name: Build and Package UWP (AppXBundle / Msix)
      run: |
        msbuild port/win/Tenkaichi3Decomp.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x64" `
          /p:AppxPackageDir="${{ github.workspace }}\build_output" `
          /p:PackageCertificateKeyFile="${{ github.workspace }}\TemporaryKey.pfx" `
          /p:PackageCertificatePassword="${{ env:CERT_PASSWORD }}" `
          /p:UapAppxPackageBuildMode=StoreUpload
      shell: powershell

    - name: Upload UWP Build Artifacts
      uses: actions/artifacts@v4
      with:
        name: Tenkaichi-Decomp-Xbox-UWP
        path: ${{ github.workspace }}\build_output\**\*_x64.appxbundle
        # أو يمكنك رفع المجلد بالكامل لاستخراج ملف الـ .appx / .msix التابع لـ Xbox Dev Mode
