name: Build Tenkaichi Decomp for Xbox

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-xbox:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود المصدري للمشروع
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. إعداد بايثون (حيث يعتمد المشروع على سكريبتات python لإدارة التكوين والملفات)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node: '3.x'

    # 3. تثبيت أدوات البناء البديلة (Ninja والمترجم المتقاطع الخاص بالـ Xbox)
    # ملاحظة: إذا كنت تستخدم حزمة مخصصة للـ Xbox (مثل أدوات GNU لـ Xbox القديم أو التجميع لـ UWP)، يتم تثبيتها هنا.
    - name: Install Build Tools (Ninja & GCC/Clang)
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build build-essential

    # 4. تشغيل سكربت التكوين الداخلي للمشروع (بدون توليد ملفات CMake)
    - name: Configure Project Layout
      run: |
        python3 configure.py

    # 5. التجميع المباشر باستخدام Ninja أو عبر سكريبتات البناء المباشرة للمشروع
    # يتم توجيه المترجم للملفات المصدرية في src/ و port/src/ مباشرة
    - name: Compile Source Code
      run: |
        # هنا يتم استدعاء ملف البناء المباشر أو تجميع الأمر عبر ملف البناء الخاص بـ Ninja
        # مثال إذا كان المشروع يدعم بناء العناوين عبر نصوص برمجية مخصصة:
        ninja -f build.ninja || (echo "يتم التجميع اليدوي عبر نص بايثون في حال عدم توفر ملف محرك البناء العام" && python3 port/release/build.py --platform xbox)

    # 6. رفع الملف التنفيذي الناتج كـ Artifact
    - name: Upload Xbox Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tenkaichi3Decomp-Xbox
        path: |
          build/
          bin/
          *.xbe
          *.exe
