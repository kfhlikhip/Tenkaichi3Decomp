name: Build Tenkaichi Decomp Xbox (No NuGet)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-xbox:
    runs-on: windows-latest

    steps:
    # 1. جلب الكود المصدري للمشروع
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # جلب المكتبات الفرعية تلقائياً إن وجدت

    # 2. إعداد مجمع MSBuild الخاص بـ Visual Studio
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. إعداد بيئة ميثون (إذا كان المشروع يعتمد على سكريبتات configure.py لتوليد الملفات)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 4. تشغيل سكريبت الإعداد وتجهيز ملفات البناء (تعديل المسار حسب مشروعك)
    - name: Run Configure Script
      run: |
        python configure.py

    # 5. البناء باستخدام MSBuild مباشرة دون استدعاء NuGet Restore
    # يتم تحديد المنصة (تعديل Durango أو Gaming.Xbox.XboxSeries.x64 أو UWP بناءً على الـ SDK المستخدم)
    - name: Build Project via MSBuild
      run: |
        msbuild Tenkaichi3Decomp.sln /p:Configuration=Release /p:Platform="Gaming.Xbox.XboxSeries.x64" /p:BuildProjectReferences=true

    # 6. رفع الحزمة الناتجة (Artifact) كملف جاهز للتحميل
    - name: Upload Xbox Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tenkaichi-Decomp-Xbox-Build
        path: |
          **/Release/**/*.xvc
          **/Release/**/*.appx
          **/Release/**/*.msixvc
          **/Release/**/*.exe
